name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust · fmt, clippy, test (${{ matrix.os }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: tests
        run: mbx test --locked

  security:
    name: Rust · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test dependency guard (offline)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Enforce Cargo release cooldown
        # Includes manual updates, transitive crates, and security PRs (which
        # Dependabot itself exempts). No crate code runs in this check.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check_cargo_cooldown.py --base "$BASE_SHA"
      - name: Install cargo-audit
        # Pin both the checksum-verifying installer and cargo-audit itself.
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit@0.22.1
          fallback: none
      - name: Audit Cargo.lock
        run: cargo audit

  python:
    name: Python · Django toolkit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The pure-Python suite runs without building the Rust extension —
      # the repo-root conftest.py stubs dbcrust._internal when it is absent
      - name: Install test dependencies
        run: pip install "pytest>=8" "Django>=4.2"
      - name: pytest
        run: pytest python/dbcrust/django/tests -q
      - name: ruff (errors only)
        run: pipx run ruff check python/dbcrust --select E9,F821,F811

  gui:
    name: GUI · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: gui
        run: bun install --frozen-lockfile
      - name: Typecheck + bundle
        working-directory: gui
        run: bun run build
