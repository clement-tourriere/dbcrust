name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust · fmt, clippy, test (${{ matrix.os }})
    needs: security
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: tests
        run: mbx test --locked

  # The jobs above build the default features (`bundled`: every engine and
  # add-on, what the release binaries and wheels ship). This one proves each
  # slice of that still compiles on its own and that the slim preset really is
  # slim. `cargo check` only, to keep it cheap.
  rust-features:
    name: Rust · feature matrix (${{ matrix.name }})
    needs: security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: none, features: "" }
          - { name: standard, features: "standard" }
          - { name: standard + python, features: "standard,python" }
          - { name: postgres, features: "postgres" }
          - { name: mysql, features: "mysql" }
          - { name: sqlite, features: "sqlite" }
          - { name: mongodb, features: "mongodb" }
          - { name: clickhouse, features: "clickhouse" }
          - { name: elasticsearch, features: "elasticsearch" }
          - { name: white-dragon, features: "white-dragon" }
          - { name: files, features: "files" }
          - { name: docker, features: "docker" }
          - { name: ai, features: "ai" }
          - { name: explain-tui, features: "explain-tui" }
          - { name: clipboard, features: "clipboard" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: check
        # abi3-py310 supplies the ABI for the `python` entry; no interpreter
        # is needed to type-check the extension.
        env:
          PYO3_NO_PYTHON: "1"
        run: mbx check --locked -p dbcrust --no-default-features --features "${{ matrix.features }}"

  rust-slim:
    name: Rust · slim build (standard preset)
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: heavy dependencies stay out of `standard`
        run: |
          cargo tree --locked -p dbcrust --no-default-features --features standard -e normal --prefix none \
            | awk '{print $1}' | sort -u > standard-crates.txt
          if grep -xE '(mongodb|bson|clickhouse|elasticsearch|datafusion(-.*)?|arrow(-.*)?|parquet|bollard|genai|ratatui|arboard|dbcrust-(ai|docker|driver-(mongodb|clickhouse|elasticsearch|white-dragon|files)))' standard-crates.txt; then
            echo "::error::the standard preset pulls in a crate that belongs to an opt-in feature"
            exit 1
          fi
      - name: clippy
        run: mbx clippy --locked -p dbcrust --no-default-features --features standard --all-targets -- -D warnings
      - name: tests
        run: mbx test --locked -p dbcrust --no-default-features --features standard

  rust-i686:
    name: Rust · 32-bit Python compatibility
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: Install 32-bit C/C++ toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
      - name: Check 32-bit Python extension
        # abi3-py310 supplies the target ABI; do not discover the runner's
        # 64-bit Python interpreter when checking our 32-bit wheel library.
        env:
          PYO3_NO_PYTHON: "1"
        # Default features (`bundled`): the wheels ship every engine, so the
        # 32-bit check must compile all of them (ClickHouse pin included).
        run: mbx check --locked -p dbcrust --lib --features python --target i686-unknown-linux-gnu

  security:
    name: Rust · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test dependency guard (offline)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Enforce Cargo release cooldown
        # Includes manual updates, transitive crates, and security PRs (which
        # Dependabot itself exempts). No crate code runs in this check.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .github/scripts/check_cargo_cooldown.py --base "$BASE_SHA"
      - name: Install cargo-audit
        # Pin both the checksum-verifying installer and cargo-audit itself.
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-audit@0.22.1
          fallback: none
      - name: Audit Cargo.lock
        run: cargo audit

  python:
    name: Python · Django toolkit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The pure-Python suite runs without building the Rust extension —
      # the repo-root conftest.py stubs dbcrust._internal when it is absent
      - name: Install test dependencies
        run: pip install "pytest>=8" "Django>=4.2"
      - name: pytest
        run: pytest python/dbcrust/django/tests -q
      - name: ruff (errors only)
        run: pipx run ruff check python/dbcrust --select E9,F821,F811

  gui-core:
    name: GUI · backend tests + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      # dbcrust-gui-core has no GPUI dependency: it builds anywhere
      - name: clippy
        run: mbx clippy --locked -p dbcrust-gui-core --all-targets --no-deps -- -D warnings
      - name: tests
        run: mbx test --locked -p dbcrust-gui-core

  gui-app:
    name: GUI · desktop app clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@adc5c234c02592f7edd008bf81d5bc0e9584dc03 # v1.2.0
        with:
          version: "1.4.1"
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libvulkan1 libzstd-dev
      - name: clippy
        run: mbx clippy --locked -p dbcrust-gui --no-deps -- -D warnings
