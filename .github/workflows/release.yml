name: "Release"

on:
  push:
    tags:
      - 'v*' # Trigger on version tags
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      should_create_release: ${{ steps.plan.outputs.should_create_release }}
    steps:
      - id: plan
        run: |
          # Determine the tag based on trigger type
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push event
            TAG="${{ github.ref_name }}"
            SHOULD_CREATE_RELEASE="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch
            TAG="${{ github.event.inputs.tag }}"
            SHOULD_CREATE_RELEASE="true"
          else
            # GitHub release event
            TAG="${{ github.event.release.tag_name }}"
            SHOULD_CREATE_RELEASE="false"
          fi

          echo "plan={\"tag\": \"$TAG\"}" >> $GITHUB_OUTPUT
          echo "should_create_release=$SHOULD_CREATE_RELEASE" >> $GITHUB_OUTPUT
          echo "Tag: $TAG, Should create release: $SHOULD_CREATE_RELEASE"

  build-binaries:
    needs: plan
    uses: ./.github/workflows/build-binaries.yml
    with:
      plan: ${{ needs.plan.outputs.plan }}
    # A called workflow sees no secret the caller does not pass, not even the
    # environment secrets of its own `environment:` job (package-macos-signed)
    secrets: inherit

  create-release:
    if: ${{ needs.plan.outputs.should_create_release == 'true' }}
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: extract_version
        run: |
          TAG_NAME="${{ fromJson(needs.plan.outputs.plan).tag }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate release notes
        env:
          MACOS_SIGNING: ${{ vars.MACOS_SIGNING }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
        run: |
          VERSION="${{ steps.extract_version.outputs.version }}"
          TAG_NAME="${{ steps.extract_version.outputs.tag_name }}"
          REPO="${{ github.repository }}"

          # Extract changelog section for this version (between two ## v headers)
          CHANGELOG=$(awk "/^## v${VERSION}/{found=1; next} /^## v/{if(found) exit} found" CHANGELOG.md)

          {
            echo "Fast Rust database workbench for the terminal: PostgreSQL, MySQL, SQLite, ClickHouse, MongoDB, Elasticsearch, SQL over Parquet/CSV/JSON, optional AI, SSH/Vault, Python API, and Django ORM analysis."
            echo ""
            echo "Docs: https://clement-tourriere.github.io/dbcrust/"
            echo ""
            echo "## What's Changed"
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
            else
              echo "No changelog entry found for this version."
              echo ""
            fi
            echo ""
            echo "---"
            echo ""
            echo "## Installation"
            echo ""
            echo "### Standalone CLI"
            echo '```bash'
            echo "curl -fsSL https://clement-tourriere.github.io/dbcrust/install.sh | sh"
            echo "dbc postgres://user:pass@localhost/mydb"
            echo '```'
            echo ""
            # owner/homebrew-tap is tapped as owner/tap
            TAP="${HOMEBREW_TAP_REPO%%/*}/${HOMEBREW_TAP_REPO#*/homebrew-}"
            if [ "$MACOS_SIGNING" = "on" ]; then
              echo "### Desktop app (macOS)"
              echo ""
              echo "[DBCrust-macos-universal.dmg](https://github.com/${REPO}/releases/download/${TAG_NAME}/DBCrust-macos-universal.dmg): signed and notarized, Apple silicon and Intel."
              if [ -n "$HOMEBREW_TAP_REPO" ]; then
                echo '```bash'
                echo "brew install --cask ${TAP}/dbcrust-gui"
                echo '```'
              fi
              echo ""
            fi
            if [ -n "$HOMEBREW_TAP_REPO" ]; then
              echo "### Homebrew (macOS, Linux)"
              echo '```bash'
              echo "brew install ${TAP}/dbcrust"
              echo '```'
              echo ""
            fi
            echo "### Python/PyPI"
            echo '```bash'
            echo "# Quick run (no installation needed)"
            echo "uvx dbcrust postgresql://user:pass@localhost/mydb"
            echo ""
            echo "# Install globally"
            echo "uv tool install dbcrust"
            echo '```'
            echo ""
            echo "**Full changelog**: [CHANGELOG.md](https://github.com/${REPO}/blob/${TAG_NAME}/CHANGELOG.md)"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.extract_version.outputs.tag_name }}
          name: DBCrust ${{ steps.extract_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(steps.extract_version.outputs.tag_name, '-') }}
          generate_release_notes: false

  publish-pypi:
    if: ${{ !contains(fromJson(needs.plan.outputs.plan).tag, '-') }}
    needs: [plan, build-binaries]
    name: Upload dbcrust to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels_dbcrust-*
          path: wheels_dbcrust
          merge-multiple: true

      - name: "List downloaded artifacts"
        run: find wheels_dbcrust -type f -name "*.whl" | head -20

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels_dbcrust/

  upload-release-artifacts:
    if: ${{ always() && !cancelled() && needs.build-binaries.result == 'success' }}
    needs: [plan, build-binaries, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Download all artifacts"
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Upload release assets"
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wheels_*/*.whl
            artifacts/wheels_*/*.tar.gz
            artifacts/binaries_*/*.tar.gz
            artifacts/binaries_*/*.zip
            artifacts/binaries_*/*.dmg
            artifacts/binaries_*/*.sha256
          tag_name: ${{ fromJson(needs.plan.outputs.plan).tag }}
          draft: false
          prerelease: ${{ contains(fromJson(needs.plan.outputs.plan).tag, '-') }}

  # Once the repository variable HOMEBREW_TAP_REPO names the tap (e.g.
  # clement-tourriere/homebrew-tap) and the secret HOMEBREW_TAP_TOKEN can push
  # to it: the formula (CLI) and, when the release has the notarized DMG, the
  # cask (desktop app), rendered from the published checksums.
  update-homebrew-tap:
    if: ${{ always() && needs.upload-release-artifacts.result == 'success' && !contains(fromJson(needs.plan.outputs.plan).tag, '-') && vars.HOMEBREW_TAP_REPO != '' }}
    needs: [plan, upload-release-artifacts]
    runs-on: ubuntu-latest
    # One tap update at a time across releases (render.py never downgrades)
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: dbcrust

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries_*
          path: assets
          merge-multiple: true

      - name: "Render the formula and the cask"
        env:
          TAG: ${{ fromJson(needs.plan.outputs.plan).tag }}
        run: python3 dbcrust/packaging/homebrew/render.py --version "${TAG#v}" --assets assets --tap tap

      - name: "Push to the tap"
        working-directory: tap
        env:
          TAG: ${{ fromJson(needs.plan.outputs.plan).tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Formula Casks 2>/dev/null || git add -A Formula
          if git diff --cached --quiet; then
            echo "The tap already has ${TAG}"
            exit 0
          fi
          git commit -m "dbcrust ${TAG#v}"
          git push
