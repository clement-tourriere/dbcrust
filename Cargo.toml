[package]
name = "dbcrust"
version = "0.38.0"
edition = "2024"
# usage-rs 6 requires Rust >= 1.91 (edition 2024 alone needs 1.85) — declared
# so `cargo install` on older toolchains fails with a clear message instead of
# a cryptic build error
rust-version = "1.91"
description = "Fast Rust database workbench for PostgreSQL, MySQL, SQLite, ClickHouse, MongoDB, Elasticsearch, and SQL over Parquet/CSV/JSON — agent-ready one-shot mode (JSON output, stable exit codes, read-only guard), optional AI, SSH/Vault, and Django analysis"
authors = ["dbcrust authors"]
license = "MIT"
repository = "https://github.com/clement-tourriere/dbcrust"
readme = "README.md"
default-run = "dbcrust"

[lib]
name = "dbcrust"
crate-type = ["cdylib", "rlib"]
required-features = ["python"]

[[bin]]
name = "dbcrust"
path = "src/main.rs"

[[bin]]
name = "dbc"
path = "src/bin/dbc.rs"

[dependencies]
reedline = { version = "0.47", default-features = false }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "sqlite",
    "mysql",
    "chrono",
    "json",
    "uuid",
    "ipnetwork",
    "rust_decimal",
    "regexp",
], default-features = false }
prettytable-rs = { version = "0.10", default-features = false }
# CLI parsing via the usage spec (https://usage.jdx.dev): derive macros compile
# the grammar into static tables; `completions` powers the in-binary
# `__complete_word__` protocol the generated shell scripts call back into
usage = { package = "usage-rs", version = "6.8", features = ["completions"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
nu-ansi-term = { version = "0.50.3", default-features = false }
pyo3 = { version = "0.29.2", features = [
    "extension-module",
    # Keep in sync with requires-python in pyproject.toml — a cp38 abi3 tag
    # with requires-python >=3.10 produced wheels pip refuses to resolve
    "abi3-py310",
], optional = true, default-features = false }
toml = { version = "0.9.12", default-features = false, features = [
    "display",
    "parse",
    "serde"
] }
dirs = { version = "6.0", default-features = false }
regex = { version = "1.12", default-features = false, features = [
    "unicode-perl",
    "std",
] }

tempfile = { version = "3.27", default-features = false }
tokio = { version = "1.52", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "time",
    "sync",
    "signal",
    "io-util",
] }
async-trait = { version = "0.1", default-features = false }
rand = { version = "0.9.4", default-features = false, features = ["std", "std_rng", "thread_rng"] }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "ansi", "env-filter"] }
tracing-appender = { version = "0.2.4", default-features = false }
url = { version = "2.5.8", default-features = false }
percent-encoding = { version = "2.3", default-features = false }
# Use ring as the crypto backend for rustls (more portable than aws-lc-rs for cross-compilation)
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }
# Multi-provider LLM client — owns provider/model handling so dbcrust doesn't
# hardcode providers or model lists. Its default `rustls-tls` feature makes
# reqwest 0.13 pull in rustls' aws-lc-rs provider (a large C/asm build), so it
# is disabled and TLS is enabled below without a bundled provider.
genai = { version = "=0.7.0-beta.2", default-features = false }
# genai's own reqwest (0.13, a different semver line from the 0.12 above): the
# alias exists only to turn on `rustls-no-provider` — same rustls + platform
# verifier as genai's `rustls-tls`, minus the aws-lc-rs provider. Never used
# directly; `tls::install_default_crypto_provider` supplies ring at runtime.
reqwest_genai = { package = "reqwest", version = "0.13", features = ["rustls-no-provider"], default-features = false }
# ring is the single rustls crypto provider (see src/tls.rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
arboard = { version = "3.4", default-features = false }
bollard = { version = "0.20", default-features = false, features = ["http", "pipe"] }
strum = { version = "0.27", features = ["derive"], default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["std", "aes", "getrandom"] }
sha2 = { version = "0.10.9", default-features = false, features = ["std"] }
# PKCE + JWT-payload decoding for "Sign in with ChatGPT" (already transitive)
base64 = { version = "0.23", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
# Wire protocol shared with the credential-free `dbcrust-agent` client; the
# broker (src/broker, Unix only) is the server side
dbcrust-agent-protocol = { path = "crates/agent-protocol", features = ["tokio"] }
# Secret store (src/secrets): Argon2id passphrase KDF, zeroized secret values
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "serde"] }
# Use rustls-tls-ring to avoid aws-lc-rs cross-compilation issues on ARM64 Linux.
# 0.15.2's Native reader uses `const ...: usize = 1 << 32`, breaking i686.
# Keep this exact pin until an upstream fix passes our 32-bit Python check.
clickhouse = { version = "=0.15.1", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
mongodb = { version = "3.9", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
bson = { version = "2.15", default-features = false }
elasticsearch = { version = "9.1.0-alpha.1", default-features = false, features = ["rustls-tls"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
hostname = { version = "0.4.2", default-features = false }

# DataFusion for file format support (Parquet, CSV, JSON, etc.)
# Optimized features: disable unused crypto/encoding/nested/compression expressions
datafusion = { version = "53.0", default-features = false, features = [
    "parquet",              # Parquet file support (includes CSV, JSON which are core)
    "sql",                  # SQL query parsing and execution
    "string_expressions",   # String functions for SQL queries
    "datetime_expressions", # Date/time functions for SQL queries
    "regex_expressions",    # Regex support in SQL queries
    "unicode_expressions",  # Unicode string handling
    "recursive_protection", # Stack overflow protection for complex queries
] }
# Note: object_store is already a transitive dependency via datafusion

# Extension support (always available)
pgvector = { version = "0.4", default-features = false, features = ["sqlx", "halfvec"] }
half = { version = "2.7", default-features = false }

# TUI support for explain visualizer
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }

[target.'cfg(unix)'.dependencies]
# geteuid / flock for the secret file backend's permission and locking checks;
# also umask/rlimit/prctl/ptrace/chown for the credential broker's hardening
libc = { version = "0.2", default-features = false }

[package.metadata.cargo-machete]
# Feature-only alias for genai's reqwest 0.13 (see the dependency comment)
ignored = ["reqwest_genai"]

[features]
default = []
python = ["pyo3", "pyo3/macros"]

[profile.release]
opt-level = "z"      # Optimize for size instead of speed
lto = "thin"         # Thin LTO: good balance of compile time and optimization
codegen-units = 1    # Single codegen unit for better optimization
strip = "symbols"    # Strip all symbols from binary
panic = "abort"      # Abort on panic for smaller binary size
debug = false        # No debug info

# Fast release profile: for local development (use with --profile fast-release)
[profile.fast-release]
inherits = "release"
lto = "thin"         # Thin LTO
codegen-units = 16   # Parallel codegen for faster compile
strip = "symbols"    # Still strip symbols

[profile.dev]
opt-level = 0          # No optimization for faster compile times during development
debug = true           # Include debug info
split-debuginfo = "unpacked"  # macOS: faster incremental builds (up to 70% faster)

# Desktop app builds (`mise run gui:*`). GPUI lays out, shapes text and
# highlights SQL on the CPU every frame: size-optimised (`release`) or
# unoptimised (`dev`) code makes typing and scrolling visibly lag.
[profile.gui-release]
inherits = "release"
opt-level = 3

# `mise run gui:dev`: dependencies (GPUI, tree-sitter, taffy…) optimised once
# and cached; the app's own crates stay quick to rebuild and debuggable.
[profile.gui-dev]
inherits = "dev"
opt-level = 1

[profile.gui-dev.package."*"]
opt-level = 3
debug = false

[profile.bench]
opt-level = 3     # Maximum optimization for benchmarks
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Maximize performance

[dev-dependencies]
rstest = { version = "0.26", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }

[lints.clippy]
# Structural lints acknowledged in AUDIT.md — allowed so CI's `-D warnings`
# gates real regressions. Remove entries as the corresponding code is
# refactored.
only_used_in_recursion = "allow"
# Enabled wholesale by the rust-version 1.91 bump (clippy now suggests
# let-chains): 135 pre-existing sites, to be collapsed in a dedicated pass
collapsible_if = "allow"
type_complexity = "allow"
enum_variant_names = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"

[workspace]
# The desktop GUI (GPUI) is opt-in: `cargo build`/`cargo test` at the root
# only build the CLI and the agent client. Use `mise run gui:*` or
# `-p dbcrust-gui[-core]` for the GUI.
members = ["crates/agent-protocol", "crates/agent", "gui", "gui/core"]
# `dbcrust-agent` is the credential-free thin client shipped next to the CLI
default-members = [".", "crates/agent"]
