[package]
name = "dbcrust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Fast Rust database workbench for PostgreSQL, MySQL, SQLite, ClickHouse, MongoDB, Elasticsearch, and SQL over Parquet/CSV/JSON — agent-ready one-shot mode (JSON output, stable exit codes, read-only guard), optional AI, SSH/Vault, and Django analysis"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
default-run = "dbcrust"

[lib]
name = "dbcrust"
crate-type = ["cdylib", "rlib"]
required-features = ["python"]

[[bin]]
name = "dbcrust"
path = "src/main.rs"

[[bin]]
name = "dbc"
path = "src/bin/dbc.rs"

[dependencies]
reedline = { version = "0.47", default-features = false }
# CLI parsing via the usage spec (https://usage.jdx.dev): derive macros compile
# the grammar into static tables; `completions` powers the in-binary
# `__complete_word__` protocol the generated shell scripts call back into
usage = { workspace = true, features = ["completions"] }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
nu-ansi-term = { version = "0.50.3", default-features = false }
pyo3 = { version = "0.29.2", features = [
    "extension-module",
    # Keep in sync with requires-python in pyproject.toml — a cp38 abi3 tag
    # with requires-python >=3.10 produced wheels pip refuses to resolve
    "abi3-py310",
], optional = true, default-features = false }
toml = { workspace = true, features = ["display", "parse", "serde"] }
dirs = { workspace = true }
regex = { version = "1.12", default-features = false, features = [
    "unicode-perl",
    "std",
] }

tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "process",
    "time",
    "sync",
    "signal",
    "io-util",
] }
async-trait = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi", "env-filter"] }
tracing-appender = { version = "0.2.4", default-features = false }
url = { workspace = true }
percent-encoding = { workspace = true }
# Use ring as the crypto backend for rustls (more portable than aws-lc-rs for cross-compilation)
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"] }
inquire = { workspace = true, features = ["crossterm"] }
# Clipboard for `\copyexplain` (feature `clipboard`)
arboard = { version = "3.4", default-features = false, optional = true }
strum = { workspace = true, features = ["derive"] }
sha2 = { workspace = true, features = ["std"] }
# Database-client traits, connection/metadata types, SQL helpers, formatting
# (everything the drivers and front ends share). `usage` lets `OutputFormat`
# derive the CLI grammar's `ValueEnum`; `tls` exposes the rustls provider setup.
dbcrust-core = { workspace = true, features = ["usage", "tls"] }
# Wire protocol shared with the credential-free `dbcrust-agent` client; the
# broker (`crates/broker`, Unix only) is the server side
dbcrust-agent-protocol = { workspace = true, features = ["tokio"] }
# Secret store, legacy credential readers and config-dir/test-mode logic
# (`dbcrust-secrets`, re-exported as `dbcrust::secrets`). The root enables
# `prompt` (passphrase prompt via inquire); `test-mode` and `test-support` are
# dev-dependency features, see [dev-dependencies].
dbcrust-secrets = { workspace = true, features = ["prompt"] }
zeroize = { workspace = true, features = ["alloc", "serde"] }
# Engine registry: every connector is a `dbcrust-driver-*` crate behind it; the
# SDK versions/features (the ClickHouse pin included) are declared once in
# `[workspace.dependencies]`. No engine is enabled here: the engine features of
# this crate (`postgres`, `mysql`, …, see [features]) forward to the registry.
dbcrust-drivers = { workspace = true }
# AI assistant (`dbcrust-ai`, re-exported as `dbcrust::ai`): genai, ChatGPT
# sign-in and provider key storage live there; `AiSession` is implemented for
# `Database` in `src/ai_session_impl.rs` (feature `ai`)
dbcrust-ai = { workspace = true, optional = true }
# Credential broker core (`dbcrust-broker`, re-exported as `dbcrust::broker`);
# the `dbcrust broker …` front end is `src/broker/`
dbcrust-broker = { workspace = true }
# Docker daemon selection, container discovery, route probing and the
# `docker exec` relay (`dbcrust-docker`, re-exported as `dbcrust::docker*`;
# feature `docker`)
dbcrust-docker = { workspace = true, optional = true }
# Concurrent metadata fetches, Docker route probing, Vault lookups
futures-util = { workspace = true }

# TUI support for the explain visualizer and the schema browser (feature
# `explain-tui`). `crossterm` stays unconditional: the wizards and the pager
# read the terminal size and drain stray key events with it.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
crossterm = { version = "0.29", default-features = false }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"], optional = true }

[target.'cfg(unix)'.dev-dependencies]
# The broker end-to-end tests (`src/broker/e2e_tests.rs`) call getuid/umask
# directly; the hardening itself lives in `dbcrust-broker`
libc = { workspace = true }

# Cargo features (see "Build features" in docs/.../development.md).
#
# `default = ["bundled"]` ships every engine and add-on DBCrust has shipped so
# far (owner decision D3); `standard` is the slim PostgreSQL/MySQL/SQLite
# preset. A new connector is a driver crate, a `dbcrust-drivers` feature and
# row, and a root feature below. Light ones are added to `bundled` explicitly
# (with a changelog note); heavy ones (DuckDB, AWS…) stay opt-in. The release
# binaries, the Python wheels and the desktop app build with `bundled`.
[features]
default = ["bundled"]
bundled = [
    "standard",
    "mongodb",
    "clickhouse",
    "elasticsearch",
    "white-dragon",
    "redis",
    "mssql",
    "redshift",
    "libsql",
    "influxdb",
    "files",
    "docker",
    "ai",
    "explain-tui",
    "clipboard",
]
standard = ["postgres", "mysql", "sqlite"]
# Engines: each forwards to the same-named feature of `dbcrust-drivers`
postgres = ["dbcrust-drivers/postgres"]
mysql = ["dbcrust-drivers/mysql"]
sqlite = ["dbcrust-drivers/sqlite"]
mongodb = ["dbcrust-drivers/mongodb"]
clickhouse = ["dbcrust-drivers/clickhouse"]
elasticsearch = ["dbcrust-drivers/elasticsearch"]
white-dragon = ["dbcrust-drivers/white-dragon"]
redis = ["dbcrust-drivers/redis"]
mssql = ["dbcrust-drivers/mssql"]
redshift = ["dbcrust-drivers/redshift"]
libsql = ["dbcrust-drivers/libsql"]
influxdb = ["dbcrust-drivers/influxdb"]
# AWS (opt-in, not in `bundled`: ~+36 crates and a Rust >= 1.94.1 toolchain).
# `aws` is the umbrella that grows with every AWS service connector.
s3 = ["dbcrust-drivers/s3"]
dynamodb = ["dbcrust-drivers/dynamodb"]
cloudwatch = ["dbcrust-drivers/cloudwatch"]
aws = ["s3", "dynamodb", "cloudwatch"]
# DataFusion: Parquet, CSV and JSON files (the heaviest default connector)
files = ["dbcrust-drivers/files"]
# DuckDB (embedded C++ engine, ~+20 MB, long cold build): opt-in, never in
# `bundled`/`standard`
duckdb = ["dbcrust-drivers/duckdb"]
# Add-ons
docker = ["dep:dbcrust-docker"]
ai = ["dep:dbcrust-ai"]
# Explain-plan TUI and schema browser TUI
explain-tui = ["dep:ratatui", "dep:textwrap"]
clipboard = ["dep:arboard"]
python = ["pyo3", "pyo3/macros"]

[profile.release]
opt-level = "z"      # Optimize for size instead of speed
lto = "thin"         # Thin LTO: good balance of compile time and optimization
codegen-units = 1    # Single codegen unit for better optimization
strip = "symbols"    # Strip all symbols from binary
panic = "abort"      # Abort on panic for smaller binary size
debug = false        # No debug info

# Fast release profile: for local development (use with --profile fast-release)
[profile.fast-release]
inherits = "release"
lto = "thin"         # Thin LTO
codegen-units = 16   # Parallel codegen for faster compile
strip = "symbols"    # Still strip symbols

[profile.dev]
opt-level = 0          # No optimization for faster compile times during development
debug = true           # Include debug info
split-debuginfo = "unpacked"  # macOS: faster incremental builds (up to 70% faster)

# Desktop app builds (`mise run gui:*`). GPUI lays out, shapes text and
# highlights SQL on the CPU every frame: size-optimised (`release`) or
# unoptimised (`dev`) code makes typing and scrolling visibly lag.
[profile.gui-release]
inherits = "release"
opt-level = 3

# `mise run gui:dev`: dependencies (GPUI, tree-sitter, taffy…) optimised once
# and cached; the app's own crates stay quick to rebuild and debuggable.
[profile.gui-dev]
inherits = "dev"
opt-level = 1

[profile.gui-dev.package."*"]
opt-level = 3
debug = false

[profile.bench]
opt-level = 3     # Maximum optimization for benchmarks
lto = true        # Enable Link Time Optimization
codegen-units = 1 # Maximize performance

[dev-dependencies]
# `cfg!(test)` is only true inside the crate under test, so the secrets crate
# would see this crate's tests as a normal build and reach the real
# ~/.config/dbcrust and keychain from any unnamed thread. `test-mode` forces
# its test-mode switch on in every test build (dev-dependency features are not
# unified into normal or release builds); `test-support` exposes the fault
# injecting backend and the legacy-value encoder the migrate/audit tests use.
dbcrust-secrets = { workspace = true, features = ["test-mode", "test-support"] }
# Fixtures (`testkit`) the end-to-end tests share with the broker crate's own
dbcrust-broker = { workspace = true, features = ["test-support"] }
rstest = { workspace = true }
# The broker's test fixtures seed a SQLite database directly and its end-to-end
# tests (gated on DATABASE_URL) talk to PostgreSQL; the clients themselves live
# in the `dbcrust-driver-*` crates, which own sqlx's runtime and type features
sqlx = { workspace = true, features = ["sqlite", "postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[workspace]
resolver = "3"
# The desktop GUI (GPUI) is opt-in: `cargo build`/`cargo test` at the root
# only build the CLI and the agent client. Use `mise run gui:*` or
# `-p dbcrust-gui[-core]` for the GUI.
members = ["crates/*", "gui", "gui/core"]
# Vendored upstream crates are path dependencies, not workspace members: they
# keep their own manifest and are exempt from the workspace lints
exclude = ["third_party/tiberius", "third_party/zip-stub"]
# `dbcrust-agent` is the credential-free thin client shipped next to the CLI;
# the library crates are listed so `cargo test`/`clippy` at the root cover them
default-members = [
    ".",
    "crates/agent",
    "crates/core",
    "crates/secrets",
    "crates/drivers",
    "crates/docker",
    "crates/ai",
    "crates/broker",
    "crates/driver-postgres",
    "crates/driver-mysql",
    "crates/driver-sqlite",
    "crates/driver-mongodb",
    "crates/driver-clickhouse",
    "crates/driver-elasticsearch",
    "crates/driver-white-dragon",
    "crates/driver-redis",
    "crates/driver-mssql",
    "crates/driver-redshift",
    "crates/driver-libsql",
    "crates/driver-influxdb",
    "crates/driver-files",
]

[workspace.package]
# Single source of truth for the version: members inherit it with
# `version.workspace = true`; Commitizen (.cz.toml) bumps this line.
version = "0.38.0"
edition = "2024"
# usage-rs 6 requires Rust >= 1.91 (edition 2024 alone needs 1.85) — declared
# so `cargo install` on older toolchains fails with a clear message instead of
# a cryptic build error
rust-version = "1.91"
authors = ["dbcrust authors"]
license = "MIT"
repository = "https://github.com/clement-tourriere/dbcrust"

# Dependencies shared by two or more members. Entries carry the version (and
# `default-features`); members list the features they need so each member's
# resolved feature set stays what it was before the workspace table existed.
[workspace.dependencies]
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0.149", default-features = false }
tokio = { version = "1.52", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
toml = { version = "0.9.12", default-features = false }
tempfile = { version = "3.27", default-features = false }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
strum = { version = "0.28", default-features = false }
usage = { package = "usage-rs", version = "6.8" }
rstest = { version = "0.27", default-features = false }
dbcrust-agent-protocol = { path = "crates/agent-protocol" }
dbcrust-secrets = { path = "crates/secrets" }
dirs = { version = "6.0", default-features = false }
hex = { version = "0.4", default-features = false }
rand = { version = "0.9.4", default-features = false }
inquire = { version = "0.9.4", default-features = false }
percent-encoding = { version = "2.3", default-features = false }
url = { version = "2.5.8", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8", default-features = false }
libc = { version = "0.2", default-features = false }
dbcrust-core = { path = "crates/core", default-features = false }
dbcrust-docker = { path = "crates/docker" }
dbcrust-ai = { path = "crates/ai" }
dbcrust-broker = { path = "crates/broker", default-features = false }
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }

# Engine registry and one crate per connector (`crates/drivers`,
# `crates/driver-*`): the registry depends on all of them, each driver only on
# `dbcrust-core` and its own SDK.
dbcrust-drivers = { path = "crates/drivers", default-features = false }
# Shared AWS foundation (credentials, region, ring HTTP client) for the AWS
# connectors; not a driver, and opt-in like them (Rust >= 1.94.1)
dbcrust-aws = { path = "crates/aws", default-features = false }
dbcrust-driver-postgres = { path = "crates/driver-postgres" }
dbcrust-driver-mysql = { path = "crates/driver-mysql" }
dbcrust-driver-sqlite = { path = "crates/driver-sqlite" }
dbcrust-driver-mongodb = { path = "crates/driver-mongodb" }
dbcrust-driver-clickhouse = { path = "crates/driver-clickhouse" }
dbcrust-driver-elasticsearch = { path = "crates/driver-elasticsearch" }
dbcrust-driver-white-dragon = { path = "crates/driver-white-dragon" }
dbcrust-driver-redis = { path = "crates/driver-redis" }
dbcrust-driver-mssql = { path = "crates/driver-mssql" }
dbcrust-driver-redshift = { path = "crates/driver-redshift" }
dbcrust-driver-libsql = { path = "crates/driver-libsql" }
dbcrust-driver-influxdb = { path = "crates/driver-influxdb" }
dbcrust-driver-s3 = { path = "crates/driver-s3" }
dbcrust-driver-dynamodb = { path = "crates/driver-dynamodb" }
dbcrust-driver-cloudwatch = { path = "crates/driver-cloudwatch" }
dbcrust-driver-files = { path = "crates/driver-files" }
dbcrust-driver-duckdb = { path = "crates/driver-duckdb" }

# Driver SDKs shared between the root crate (until its drivers move) and the
# driver crates. Versions and the always-needed features live here; members add
# engine-specific features (sqlx, pgvector, reqwest) on their own line.
async-trait = { version = "0.1", default-features = false }
sqlx = { version = "0.8", default-features = false }
pgvector = { version = "0.4", default-features = false }
reqwest = { version = "0.12.28", default-features = false }
# DuckDB's engine version is encoded in the crate version (1.10506.0 = DuckDB
# 1.5.6); exact pin, features chosen by `dbcrust-driver-duckdb`
duckdb = { version = "=1.10506.0", default-features = false }
mongodb = { version = "3.9", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
bson = { version = "2.15", default-features = false }
elasticsearch = { version = "9.1.0-alpha.1", default-features = false, features = ["rustls-tls"] }
# Use rustls-tls-ring to avoid aws-lc-rs cross-compilation issues on ARM64 Linux.
# 0.15.2's Native reader uses `const ...: usize = 1 << 32`, breaking i686.
# Keep this exact pin until an upstream fix passes our 32-bit Python check.
# Redis: rustls with no bundled provider (DBCrust installs ring at startup, so
# neither aws-lc-rs nor OpenSSL is pulled in); tokio runtime; `ConnectionManager`
# for reconnects. Exact pin: reviewed 1.7.1 (see the dependency policy).
redis = { version = "=1.7.1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
# SQL Server: the vendored tiberius 0.13.0 (third_party/tiberius/DBCRUST_PATCH.md) —
# rustls on ring only (no aws-lc-rs, OpenSSL or native-tls); `tds80` implies the
# modern date/time types, `sql-browser-tokio` resolves named instances. No
# `winauth`/`integrated-auth-gssapi`/`sspi-rs`: SQL authentication only.
tiberius = { path = "third_party/tiberius", default-features = false, features = ["rustls", "tds73", "tds80", "sql-browser-tokio"] }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
# AWS SDK (feature `aws`/`s3`): exact pins, reviewed per the dependency policy
# (age, maintainers, RustSec, new transitive crates). TLS is rustls on ring only:
# `default-features = false` everywhere (the defaults pull aws-lc-rs) and the
# ring HTTP client is injected by `dbcrust-aws`, see crates/aws/src/http.rs.
aws-config = { version = "=1.12.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }
aws-smithy-http-client = { version = "=1.5.0", default-features = false, features = ["rustls-ring"] }
aws-sdk-s3 = { version = "=1.152.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-dynamodb = { version = "=1.130.0", default-features = false, features = ["rt-tokio"] }
aws-sdk-cloudwatchlogs = { version = "=1.156.0", default-features = false, features = ["rt-tokio"] }
# InfluxDB: no SDK (see crates/driver-influxdb); csv-core reads the Flux/v3 CSV
# streams record by record, already in the lockfile through `csv`
csv-core = { version = "0.1.12", default-features = false }
clickhouse = { version = "=0.15.1", default-features = false, features = ["lz4", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
# DataFusion for file format support (Parquet, CSV, JSON, …). Optimized
# features: disable unused crypto/encoding/nested/compression expressions
datafusion = { version = "53.0", default-features = false, features = [
    "parquet",              # Parquet file support (includes CSV, JSON which are core)
    "sql",                  # SQL query parsing and execution
    "string_expressions",   # String functions for SQL queries
    "datetime_expressions", # Date/time functions for SQL queries
    "regex_expressions",    # Regex support in SQL queries
    "unicode_expressions",  # Unicode string handling
    "recursive_protection", # Stack overflow protection for complex queries
] }

[workspace.lints.clippy]
# Structural lints acknowledged in AUDIT.md — allowed so CI's `-D warnings`
# gates real regressions. Remove entries as the corresponding code is
# refactored.
only_used_in_recursion = "allow"
# Enabled wholesale by the rust-version 1.91 bump (clippy now suggests
# let-chains): 135 pre-existing sites, to be collapsed in a dedicated pass
collapsible_if = "allow"
type_complexity = "allow"
enum_variant_names = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"

# `libduckdb-sys` (feature `duckdb`) has a build dependency on `zip = "^6"`, every
# release of which is yanked. Only its non-bundled download mode uses it, so a
# stand-in crate replaces it: third_party/zip-stub/DBCRUST_PATCH.md
[patch.crates-io]
zip = { path = "third_party/zip-stub" }
