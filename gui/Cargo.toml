[package]
name = "dbcrust-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust desktop app — a native GPU-accelerated database workbench built with GPUI Kit"
default-run = "dbcrust-gui"

[lib]
name = "dbcrust_gui"
path = "src/lib.rs"

[[bin]]
name = "dbcrust-gui"
path = "src/main.rs"

[[bin]]
name = "dbcrust-gui-screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[features]
default = []
# Headless renderer + capture used by `mise run gui:screenshots`
screenshots = ["gpui-kit/test-support", "dep:tempfile", "dep:chrono"]
# The opt-in DuckDB engine in the connection form (a C++ build, +20 MB)
duckdb = ["dbcrust-gui-core/duckdb"]

[dependencies]
dbcrust-gui-core = { path = "core" }
# Pinned: implement against the published 0.7.1 sources (the upstream main
# branch has diverged under the same version number)
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-sql"] }
# Types of GPUI Kit's LSP-style completion provider (same version as gpui-base)
lsp-types = "0.97"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
strum = { workspace = true, features = ["derive", "std"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter"] }
# Wakes GPUI from the tray's native callbacks (already in the tree through GPUI)
async-channel = "2"
# Decodes the bundled tray icons (the screenshot harness encodes PNGs with it too)
image = { version = "0.25", default-features = false, features = ["png"] }
# Raw NSView / HWND of the main window, to hide it without destroying it
raw-window-handle = "0.6"
tempfile = { workspace = true, features = ["getrandom"], optional = true }
chrono = { workspace = true, optional = true }

# The menu bar / notification area icon. Linux has no tray this round (GPUI
# cannot hide a window there and tray-icon needs a GTK main loop), so nothing
# of this is compiled or linked on Linux.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["tree-sitter-sql", "test-support"] }
# Enables the secrets crate's `test-mode` switch for this crate's tests: the
# `cfg!(test)` heuristic is only true inside the crate that owns the code, so
# threads a test spawns would otherwise reach the real config dir and keychain.
dbcrust-secrets = { workspace = true, features = ["test-mode"] }
rstest = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }

[package.metadata.cargo-machete]
# Feature-only dev-dependency (see [dev-dependencies])
ignored = ["dbcrust-secrets"]

[lints]
workspace = true
