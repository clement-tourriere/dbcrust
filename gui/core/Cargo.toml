[package]
name = "dbcrust-gui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "GPUI-free backend of the DBCrust desktop app: per-connection database workers, config/storage ownership, and pure query/result/schema models"

[dependencies]
# The shared layers the CLI is built on, never the CLI crate itself (`dbcrust`:
# REPL, `inquire`, TUIs, broker, AI). `dbcrust-app` holds config, storage and
# `Database`; `docker` adds the container picker and the `docker://` routes.
dbcrust-app = { workspace = true, features = ["docker"] }
dbcrust-core = { workspace = true, features = ["tls"] }
dbcrust-docker = { workspace = true }
dbcrust-secrets = { workspace = true }
# Every engine of the CLI's `bundled` preset (DuckDB and AWS stay opt-in)
dbcrust-drivers = { workspace = true, features = [
    "postgres",
    "mysql",
    "sqlite",
    "mongodb",
    "clickhouse",
    "elasticsearch",
    "white-dragon",
    "redis",
    "mssql",
    "redshift",
    "libsql",
    "influxdb",
    "files",
] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["std", "display", "parse", "serde"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std", "attributes"] }
chrono = { workspace = true }

[features]
default = []
# The opt-in DuckDB engine (a C++ build, +20 MB): `cargo build -p dbcrust-gui --features duckdb`
duckdb = ["dbcrust-drivers/duckdb"]

[dev-dependencies]
# Enables the secrets crate's `test-mode` switch for this crate's tests: the
# `cfg!(test)` heuristic is only true inside the crate that owns the code, so
# threads a test spawns would otherwise reach the real config dir and keychain.
dbcrust-secrets = { workspace = true, features = ["test-mode"] }
rstest = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
