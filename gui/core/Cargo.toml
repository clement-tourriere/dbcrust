[package]
name = "dbcrust-gui-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "GPUI-free backend of the DBCrust desktop app: per-connection database workers, config/storage ownership, and pure query/result/schema models"

[dependencies]
# `bundled`: the desktop app offers every engine and the Docker picker
dbcrust = { path = "../..", default-features = false, features = ["bundled"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["std", "display", "parse", "serde"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std", "attributes"] }
chrono = { workspace = true }

[dev-dependencies]
# Enables the secrets crate's `test-mode` switch for this crate's tests: the
# `cfg!(test)` heuristic is only true inside the crate that owns the code, so
# threads a test spawns would otherwise reach the real config dir and keychain.
dbcrust-secrets = { workspace = true, features = ["test-mode"] }
rstest = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }

[package.metadata.cargo-machete]
# Feature-only dev-dependency (see [dev-dependencies])
ignored = ["dbcrust-secrets"]

[lints]
workspace = true
