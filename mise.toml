[tools]
bun = "1.2.10"
hk = "latest"
mr-boxington = "1.4.1"
"pipx:commitizen" = "latest"
pkl = "latest"
ruff = "latest"
ty = "latest"

# Project-scoped Cargo caching. Wrappers require mise 2026.8.16 or newer.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[env]
_.python.venv = ".venv"

# ══════════════════════════════════════════════════════════════════════════════
# Core CLI Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."build"]
description = "Build the CLI in release mode"
run = "cargo build --release"

[tasks."build:dev"]
description = "Build the CLI in debug mode"
run = "cargo build"

[tasks."install"]
description = "Build release binaries and install dbcrust + dbc + dbcrust-agent locally (~/.cargo/bin)"
run = [
  "cargo install --path . --locked --force",
  "cargo install --path crates/agent --locked --force",
]

[tasks."test"]
description = "Run all tests"
run = "cargo test"

[tasks."lint"]
description = "Run clippy linting (same flags as CI)"
run = "cargo clippy --all-targets -- -D warnings"

[tasks."fmt"]
description = "Format all Rust code"
run = "cargo fmt"

[tasks."check"]
description = "Run fmt + clippy + tests + Python lint/type-check/tests (CI parity)"
depends = ["fmt", "lint", "test", "py:lint", "py:test"]

# ══════════════════════════════════════════════════════════════════════════════
# GUI Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."gui:dev"]
description = "Run the desktop app (debug build of the app, optimised dependencies)"
run = "cargo run -p dbcrust-gui --profile gui-dev"

[tasks."gui:build"]
description = "Build the desktop app in release mode (target/gui-release/dbcrust-gui)"
run = "cargo build -p dbcrust-gui --profile gui-release"

[tasks."gui:install"]
description = "Install the desktop app binary (dbcrust-gui) into ~/.cargo/bin"
run = "cargo install --path gui --bin dbcrust-gui --profile gui-release --locked --force"

[tasks."gui:bundle"]
description = "Build a macOS DBCrust.app bundle into target/gui-release/bundle/"
run = "bash gui/bundle/macos/bundle.sh"

[tasks."gui:test"]
description = "Run the desktop app backend tests (no GPUI needed)"
run = "cargo test -p dbcrust-gui-core"

[tasks."gui:lint"]
description = "Clippy on the desktop app crates (same flags as CI)"
run = [
  "cargo clippy -p dbcrust-gui-core --all-targets --no-deps -- -D warnings",
  "cargo clippy -p dbcrust-gui --no-deps -- -D warnings",
]

[tasks."gui:screenshots"]
description = "Render the README/docs screenshots headlessly (seeded demo database)"
run = "bash gui/scripts/screenshots.sh"

[tasks."gui:clean"]
description = "Remove desktop app build artifacts"
run = "cargo clean -p dbcrust-gui -p dbcrust-gui-core"

# ══════════════════════════════════════════════════════════════════════════════
# Python Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."py:dev"]
description = "Build Python package for development"
run = "maturin develop"

[tasks."py:build"]
description = "Build Python wheel"
run = "maturin build --release"

[tasks."py:test"]
description = "Run Python tests"
run = "python -m pytest python/dbcrust/django/tests/"

[tasks."py:lint"]
description = "Lint + type-check the Python package (ruff matches CI, ty)"
run = [
    "ruff check python/dbcrust --select E9,F821,F811",
    "ty check python/dbcrust",
]

# ══════════════════════════════════════════════════════════════════════════════
# Documentation Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."docs"]
description = "Serve documentation locally with live-reload (http://localhost:4321)"
run = "bun run --cwd docs dev"

[tasks."docs:build"]
description = "Build documentation site into docs/dist/"
run = "bun run --cwd docs build"

[tasks."docs:preview"]
description = "Preview the built documentation site"
run = "bun run --cwd docs preview"

[tasks."docs:install"]
description = "Install documentation dependencies"
run = "bun install --cwd docs"

# ══════════════════════════════════════════════════════════════════════════════
# Release Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."release"]
description = "Run commitizen release bump"
run = "cz bump --check-consistency"

[tasks."release:dry-run"]
description = "Preview the next commitizen release bump without changing files"
run = "cz bump --dry-run --yes --check-consistency"

[tasks."release:patch"]
description = "Run a PATCH release bump with commitizen"
run = "cz bump --increment PATCH --check-consistency"

[tasks."release:minor"]
description = "Run a MINOR release bump with commitizen"
run = "cz bump --increment MINOR --check-consistency"

[tasks."release:major"]
description = "Run a MAJOR release bump with commitizen"
run = "cz bump --increment MAJOR --check-consistency"

# ══════════════════════════════════════════════════════════════════════════════
# Combined Tasks
# ══════════════════════════════════════════════════════════════════════════════

[tasks."all:build"]
description = "Build everything (CLI + GUI + Python)"
depends = ["build", "gui:build", "py:build"]

[tasks."all:clean"]
description = "Clean all build artifacts"
run = """
cargo clean
mbx clean
rm -rf target
"""

# ══════════════════════════════════════════════════════════════════════════════
# Build Cache (Mr Boxington)
# ══════════════════════════════════════════════════════════════════════════════

[tasks."cache:stats"]
description = "Show what the shared Cargo build cache saved and how much disk it uses"
run = ["mbx stats", "mbx cache stats"]

[tasks."cache:gc"]
description = "Reclaim build-cache disk space now (`mise run cache:gc -- --dry-run` to preview)"
run = "mbx gc"
