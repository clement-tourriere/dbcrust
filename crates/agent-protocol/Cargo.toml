[package]
name = "dbcrust-agent-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Wire protocol between the DBCrust credential broker and the thin dbcrust-agent client: length-prefixed JSON frames, no credential-bearing fields"

# Keep this crate tiny: it is linked by the credential-free agent client and by
# the broker. Do not add database drivers, keystores, or HTTP stacks here.
[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util"], optional = true }

[features]
default = []
# Async framing helpers over tokio's AsyncRead/AsyncWrite
tokio = ["dep:tokio"]

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "macros"] }

[lints]
workspace = true
