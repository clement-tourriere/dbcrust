[package]
name = "dbcrust-driver-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust SQLite driver (sqlx)"

# Layer 1 of the crate split: depends on `dbcrust-core` and this engine's SDK
# only (never the root crate, secrets, Docker, AI or another driver); the
# registry `dbcrust-drivers` is what links it into a build.
[dependencies]
dbcrust-core = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true, features = ["std"] }
# `runtime-tokio` without TLS: an embedded engine needs no rustls
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "regexp", "chrono"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }


[lints]
workspace = true
