[package]
name = "dbcrust-driver-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust MongoDB driver (mongodb + bson)"

# Layer 1 of the crate split: depends on `dbcrust-core` and this engine's SDK
# only (never the root crate, secrets, Docker, AI or another driver); the
# registry `dbcrust-drivers` is what links it into a build.
[dependencies]
dbcrust-core = { workspace = true }
async-trait = { workspace = true }
bson = { workspace = true, features = ["serde"] }
futures-util = { workspace = true }
mongodb = { workspace = true }
percent-encoding = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
