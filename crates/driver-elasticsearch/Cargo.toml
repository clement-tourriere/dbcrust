[package]
name = "dbcrust-driver-elasticsearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust Elasticsearch driver (elasticsearch client, SQL API)"

# Layer 1 of the crate split: depends on `dbcrust-core` and this engine's SDK
# only (never the root crate, secrets, Docker, AI or another driver); the
# registry `dbcrust-drivers` is what links it into a build.
[dependencies]
dbcrust-core = { workspace = true }
async-trait = { workspace = true }
elasticsearch = { workspace = true }
# Default features: the table-name patterns use `(?i)`, which needs
# `unicode-case`; do not rely on a sibling crate to supply it
regex = "1.12"
serde_json = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
