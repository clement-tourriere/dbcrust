[package]
name = "dbcrust-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "Thin, credential-free DBCrust client for AI agents: talks to the DBCrust broker over a Unix socket (one-shot CLI + MCP server)"

[[bin]]
name = "dbcrust-agent"
path = "src/main.rs"

# ─────────────────────────────────────────────────────────────────────────────
# KEEP THIS CRATE THIN.
#
# `dbcrust-agent` runs inside the AI agent's trust boundary and must never be
# able to see credentials. It therefore must NOT depend on the root `dbcrust`
# crate, nor on anything that links a keystore, database drivers, config
# storage, an HTTP stack, or an LLM client (sqlx, keyring, datafusion, reqwest,
# mongodb, clickhouse, genai, …). Allowed: the protocol crate, tokio (minimal
# features), serde_json, the CLI parser. Verify after touching dependencies:
#
#   mise exec -- cargo tree --locked -p dbcrust-agent -e normal
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
dbcrust-agent-protocol = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "io-std", "macros", "time"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
# Same CLI grammar engine as the main `dbcrust` binary (see src/cli.rs there)
usage = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
