[package]
name = "dbcrust-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust secret store (OS keychain or Argon2id passphrase file), config-directory/test-mode resolution, and the read-only legacy credential readers"

# Keep this crate free of the CLI, the REPL, config parsing, database drivers
# and any HTTP/LLM stack: the credential broker links it (and `cargo tree -p
# dbcrust-secrets` must stay clear of sqlx, datafusion, reqwest, genai, …).
[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["std", "aes", "getrandom"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chrono = { workspace = true }
dirs = { workspace = true }
hex = { workspace = true, features = ["std"] }
hostname = { version = "0.4.2", default-features = false }
inquire = { workspace = true, features = ["crossterm"], optional = true }
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native"] }
percent-encoding = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["display", "parse", "serde"] }
tracing = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["alloc", "serde"] }

[target.'cfg(unix)'.dependencies]
# geteuid / flock for the secret file backend's permission and locking checks
libc = { workspace = true }

[features]
default = []
# Passphrase prompt for the encrypted file backend (`PromptPassphrase`). Off:
# the same type reports `SecretError::Locked`, so non-interactive consumers
# (the credential broker) pull in no terminal-prompt stack.
prompt = ["dep:inquire"]
# Forces `paths::is_test_mode()` on in every build of this crate. `cfg!(test)`
# is only true while *this* crate's own unit tests compile; a crate whose tests
# reach config/secrets enables this from its `[dev-dependencies]` (dev features
# are not unified into normal or release builds). Never enable it in `[dependencies]`.
test-mode = []
# `testing::FaultyBackend` and `legacy::password_encryption::legacy_encrypt_for_tests`
# for other crates' tests. Dev-dependency only, like `test-mode`.
test-support = []

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
