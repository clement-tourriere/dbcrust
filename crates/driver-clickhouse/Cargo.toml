[package]
name = "dbcrust-driver-clickhouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust ClickHouse driver (clickhouse HTTP client)"

# Layer 1 of the crate split: depends on `dbcrust-core` and this engine's SDK
# only (never the root crate, secrets, Docker, AI or another driver); the
# registry `dbcrust-drivers` is what links it into a build.
[dependencies]
dbcrust-core = { workspace = true }
async-trait = { workspace = true }
# The exact `=0.15.1` pin and its feature set are in `[workspace.dependencies]`
clickhouse = { workspace = true }
# Request building for the hand-rolled HTTP calls; TLS comes from rustls
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
rstest = { workspace = true }

[lints]
workspace = true
