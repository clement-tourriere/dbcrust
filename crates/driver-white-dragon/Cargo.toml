[package]
name = "dbcrust-driver-white-dragon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "DBCrust White Dragon driver (SQL/qualifier search over HTTP)"

# Layer 1 of the crate split: depends on `dbcrust-core` and this engine's SDK
# only (never the root crate, secrets, Docker, AI or another driver); the
# registry `dbcrust-drivers` is what links it into a build.
[dependencies]
dbcrust-core = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
